    <svg id="orn" width="360" height="40" viewBox="0 0 360 40"><line x1="0" y1="20" x2="150" y2="20" stroke="#E0A526" stroke-width="1.5"/><line x1="210" y1="20" x2="360" y2="20" stroke="#E0A526" stroke-width="1.5"/><g transform="translate(180 20)"><polygon points="0,-18 5,-12 13,-13 12,-5 18,0 12,5 13,13 5,12 0,18 -5,12 -13,13 -12,5 -18,0 -12,-5 -13,-13 -5,-12" fill="#E0A526"/><polygon points="0,-8 2.4,-5.6 5.6,-5.6 5.6,-2.4 8,0 5.6,2.4 5.6,5.6 2.4,5.6 0,8 -2.4,5.6 -5.6,5.6 -5.6,2.4 -8,0 -5.6,-2.4 -5.6,-5.6 -2.4,-5.6" fill="#0D1A47"/></g></svg>
    <div id="vers" data-f="arabischer_text"></div>
    <p id="text" data-f="text"></p>
    <div id="badge"></div>
  </div>
  <div id="cta"><span data-f="aufruf"></span><b data-f="zaehler"></b></div>
  <div id="warnung">Text zu lang für dieses Format – bitte kürzen oder auf zwei Posts aufteilen.</div>
</div>
<script>
/* ===== INHALT (Beispiel) – wird beim automatischen Rendern ersetzt ===== */
window.INHALT = {
  hintergrund: "hintergruende/1_fliesen.jpg", layout: "bogen",
  kopf_rechts: "Quelle 01", arabischer_begriff: "عِيسَى ٱبْنُ مَرْيَمَ",
  titel: "Jesus,\nSohn Marias", titel_akzent: "", label: "Was der Koran sagt", arabischer_text: "",
  text: "Der Koran nennt Jesus den Messias, Sohn Marias – angesehen im Diesseits und im Jenseits.",
  quelle_links: "Koran 3:45 · sinngemäß", quelle_rechts: "",
  aufruf: "Fragen zur islamischen Sicht? Schreiben Sie uns.", zaehler: ""
};
window.DESIGN_SETUP = (D, post, val) => {
  fill(document.getElementById('kick'), [val('label'), val('kopf_rechts')].filter(Boolean).join(' · '));
  fill(document.getElementById('badge'), [val('quelle_links'), val('quelle_rechts')].filter(Boolean).join(' · '));
};
window.DESIGN_FIT = (D, post) => {
  const lay = post.dataset.layout, i = document.getElementById('inhalt'), m = document.getElementById('med');
  const top = i.offsetTop, bottom = i.offsetTop + i.offsetHeight;
  const bad = () => {
    const t = i.offsetTop, b = i.offsetTop + i.offsetHeight;
    if (lay === 'bogen') return b > 1236;
    if (lay === 'fenster') return t < 715;
    const limit = m.classList.contains('leer') ? 150 : 500;
    return t < limit;
  };
  return fitLoop({'--t-h1':96,'--t-p':37,'--t-v':38}, [['--t-h1',76,4],['--t-p',30,1],['--t-v',30,1],['--t-h1',64,4]], bad);
};
/* ---- Gemeinsame Vorlagen-Logik: Felder füllen, leere Felder ausblenden, automatische Anpassung ---- */
(function(){
  const D = Object.assign({}, window.INHALT || {}, window.INHALT_OVERRIDE || {});
  window.D = D;
  const post = document.getElementById('post');
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const val = k => (D[k] ?? '').toString().trim();
  if (val('hintergrund')) post.style.backgroundImage = `url("${val('hintergrund')}")`;
  if (val('layout')) post.dataset.layout = val('layout');
  window.fill = (el, v) => { el.innerHTML = esc(v).replace(/\\n|\n/g,'<br>'); el.classList.toggle('leer', !v); };
  document.querySelectorAll('[data-f]').forEach(el => fill(el, val(el.dataset.f)));
  document.querySelectorAll('[data-if]').forEach(el => {
    if (!el.dataset.if.split(',').some(k => val(k))) el.classList.add('leer');
  });
  if (window.DESIGN_SETUP) window.DESIGN_SETUP(D, post, val);
  /* Schrittweise verkleinern: [css-Variable, Startwert, Minimum, Schritt] */
  window.fitLoop = (start, steps, bad) => {
    const st = document.documentElement.style, cur = {};
    for (const [k, v] of Object.entries(start)) { cur[k] = v; st.setProperty(k, v + 'px'); }
    let g = 0;
    for (const [k, min, step] of steps)
      while (bad() && cur[k] > min && g++ < 500) { cur[k] = Math.max(min, cur[k] - step); st.setProperty(k, cur[k] + 'px'); }
    const verkleinert = Object.entries(start).some(([k, v]) => cur[k] < v * 0.84);
    return { ok: !bad(), verkleinert, werte: cur };
  };
  const ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  ready.then(() => {
    const r = window.DESIGN_FIT ? window.DESIGN_FIT(D, post, val) : { ok: true, verkleinert: false };
    post.classList.toggle('zu-lang', !r.ok);
    window.FIT_STATUS = r;
  });
})();

</script>
</body></html>
