  if (n) num.innerHTML = esc(n).replace(/:/, '<i>:</i>'); else num.classList.add('leer');
  if (/^\d{4,}$/.test(n)) document.documentElement.style.setProperty('--t-num', '300px');
  const rows = [];
  const woertlich = val('texttyp').toLowerCase().startsWith('w');
  rows.push([woertlich ? 'Übersetzung' : 'Inhalt<br>sinngemäß', `<div class="v">${esc(val('text'))}</div>`]);
  if (val('arabischer_text')) rows.push(['Original', `<div class="v ar">${esc(val('arabischer_text'))}</div>`]);
  else if (val('arabischer_begriff')) rows.push(['Begriff', `<div class="v m"><span class="kufi">${esc(val('arabischer_begriff'))}</span></div>`]);
  if (val('quellentyp').toLowerCase().startsWith('h')) rows.push(['Einstufung', `<div class="v m">${esc(val('zusatz') || 'vor Veröffentlichung angeben')}</div>`]);
  else rows.push(['Texttyp', `<div class="v m">${esc(woertlich ? 'wörtlich · Übers. ' + (val('uebersetzer') || '?') : 'sinngemäß')}</div>`]);
  document.getElementById('doc').innerHTML = rows.map(([k, v]) => `<div class="row"><div class="k">${k}</div>${v}</div>`).join('');
  if (!n) { document.getElementById('ref').style.top = '150px'; document.getElementById('titel').style.top = '216px'; }
};
window.DESIGN_FIT = () => {
  const num = document.getElementById('num');
  const st = document.documentElement.style;
  let s = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--t-num')) || 350;
  while (!num.classList.contains('leer') && num.scrollWidth > num.clientWidth + 2 && s > 200) { s -= 10; st.setProperty('--t-num', s + 'px'); }
  const t = document.getElementById('titel'), d = document.getElementById('doc');
  const bad = () => (t.offsetTop + t.offsetHeight + 30 > d.offsetTop) || (t.scrollWidth > t.clientWidth + 2);
  return fitLoop({'--t-h1':98,'--t-v':33,'--t-ar':34}, [['--t-h1',78,4],['--t-v',26,1],['--t-ar',26,1],['--t-h1',64,4]], bad);
};
/* ---- Gemeinsame Vorlagen-Logik: Felder füllen, leere Felder ausblenden, automatische Anpassung ---- */
(function(){
  const D = Object.assign({}, window.INHALT || {}, window.INHALT_OVERRIDE || {});
  window.D = D;
  const post = document.getElementById('post');
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const val = k => (D[k] ?? '').toString().trim();
  if (val('hintergrund')) post.style.backgroundImage = `url("${val('hintergrund')}")`;
  if (val('layout')) post.dataset.layout = val('layout');
  window.fill = (el, v) => { el.innerHTML = esc(v).replace(/\\n|\n/g,'<br>'); el.classList.toggle('leer', !v); };
  document.querySelectorAll('[data-f]').forEach(el => fill(el, val(el.dataset.f)));
  document.querySelectorAll('[data-if]').forEach(el => {
    if (!el.dataset.if.split(',').some(k => val(k))) el.classList.add('leer');
  });
  if (window.DESIGN_SETUP) window.DESIGN_SETUP(D, post, val);
  /* Schrittweise verkleinern: [css-Variable, Startwert, Minimum, Schritt] */
  window.fitLoop = (start, steps, bad) => {
    const st = document.documentElement.style, cur = {};
    for (const [k, v] of Object.entries(start)) { cur[k] = v; st.setProperty(k, v + 'px'); }
    let g = 0;
    for (const [k, min, step] of steps)
      while (bad() && cur[k] > min && g++ < 500) { cur[k] = Math.max(min, cur[k] - step); st.setProperty(k, cur[k] + 'px'); }
    const verkleinert = Object.entries(start).some(([k, v]) => cur[k] < v * 0.84);
    return { ok: !bad(), verkleinert, werte: cur };
  };
  const ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  ready.then(() => {
    const r = window.DESIGN_FIT ? window.DESIGN_FIT(D, post, val) : { ok: true, verkleinert: false };
    post.classList.toggle('zu-lang', !r.ok);
    window.FIT_STATUS = r;
  });
})();

</script>
